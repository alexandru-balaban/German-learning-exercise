  <rect x="33.5" y="29" width="11.5" height="7" rx="2.5" fill="#0B1220"/>
  <rect x="29.5" y="30.5" width="5" height="2" fill="#0B1220"/>
  <path d="M21.5 31 L24.5 31" stroke="#60A5FA" stroke-width="1.4" stroke-linecap="round"/>
  <path d="M36 31 L39 31" stroke="#60A5FA" stroke-width="1.4" stroke-linecap="round"/>
  <!-- smirk -->
