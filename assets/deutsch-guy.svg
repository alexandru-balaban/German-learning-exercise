  <defs>
    <linearGradient id="dg-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3B82F6"/><stop offset="1" stop-color="#1D4ED8"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="16" fill="url(#dg-bg)"/>
  <!-- shirt with a black-red-gold collar -->
  <path d="M14 64 C15 54 22 50 32 50 C42 50 49 54 50 64 Z" fill="#0B1220"/>
  <rect x="24" y="49" width="16" height="2.4" fill="#0B1220"/>
  <rect x="24" y="51.4" width="16" height="2.4" fill="#DD0000"/>
  <rect x="24" y="53.8" width="16" height="2.4" fill="#FFCE00"/>
