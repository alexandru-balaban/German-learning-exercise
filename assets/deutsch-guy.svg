  <!-- quiff -->
  <path d="M16.5 30 C15.5 19 23 12.5 32.5 12.5 C41 12.5 47.5 17 48 25 C45 21.5 40 20.5 35 22.5 C29 19.5 21.5 22 16.5 30 Z" fill="#0B1220"/>
